<ngx-spinner
    bdColor = "rgba(29, 78, 216, 0.9)"
    size="medium"
    type="square-jelly-box"
    [fullScreen]="true"
>
    <p class="text-white text-3xl italic">
        Chargement en cours, patientez s'il vous plaît !!!
    </p>
</ngx-spinner>

<!-- image de l'accueil & description ici -->
<section>
    <app-box-content>
        <div class="flex items-center">
            <div class="w-9/12">
                <app-heading variant="h1" label="la boutique moderne" class="uppercase text-primary"/>
            </div>
            <img [src]="image" alt="Un chariot qui représente le logo de la boutique" class="w-full h-[75vh]">
        </div>
    </app-box-content>
</section>

<!-- slide avec swiper -->
<section class="bg-primary py-4 text-primary-content">
    <app-box-content>
        <app-heading variant="h3" label="catégorie de nos produits" class="uppercase text-primary-content mb-6"/>
    <!-- gestion des slides avec swiper -->
    <swiper-container navigation="true" class="mt-6 mb-3" slides-per-view="8" space-between="6" 
    style="--swiper-navigation-color:#ffffff"
    >
        <swiper-slide class="px-10"><i class="ri-store-2-line ri-2x"></i></swiper-slide>
        <swiper-slide class="px-10"><i class="ri-hospital-fill ri-2x"></i></swiper-slide>
        <swiper-slide class="px-10"><i class="ri-tent-line ri-2x"></i></swiper-slide>
        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>
        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>
        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>
        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>
        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>
        <!-- 2ième groupe -->
        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>
        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>
        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>
        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>
        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>
        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>
        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>
        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>
        <!-- 3ième groupe -->
        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>
        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>
        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>
        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>

        <swiper-slide class="px-10"><i class="ri-macbook-line ri-2x"></i></swiper-slide>
    </swiper-container>
    </app-box-content>
</section>
