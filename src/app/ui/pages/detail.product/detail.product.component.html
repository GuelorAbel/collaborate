@if ($product(); as prod) {
    <section class="my-auto pt-12 pb-8">
        <app-box-content>
        <!--  menu fil d'Ariane pour naviguer dans l'application -->
        <div class="breadcrumbs text-sm">
            <ul>
            <li><a routerLink="/">Accueil</a></li>
            <li><a routerLink="/nos-produits">Boutique</a></li>
            <li class="font-semibold text-primary"> {{ prod.title }} </li>
            </ul>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
            <!-- espace de l'image -->
            <div class="md:my-auto">
            <img [src]="prod.image" alt="prod.title" class="w-56 md:w-[65%] object-cover mx-auto">
            </div>
            <!-- espace du contenu -->
            <div class="px-4 md:my-auto">
            <app-heading variant="h1" [label]="prod.title" class="uppercase" />
            <hr class="my-2">
            <!-- espace de la description en dessous -->
            <div>
                <!-- la description du produit -->
                <app-paragraph>
                {{ prod.description }}
                </app-paragraph>
                <!-- la categorie & le prix -->
                <div class="flex justify-between items-center">
                <div>
                    <app-paragraph>
                    Catégorie :  <span class="font-bold uppercase text-primary"> {{ prod.category}} </span>
                    </app-paragraph>
                </div>

                <div>
                <app-paragraph>
                    Prix :  <span class="font-bold uppercase text-success"> {{ prod.price | currency: "EUR" }} </span>
                </app-paragraph>
                </div>

                <div>
                    <app-paragraph>
                    Note :  <span class="font-bold uppercase text-primary"> {{ prod.rating.rate}} </span>
                    </app-paragraph>
                </div>

                <div>
                    <app-paragraph> Stock :
                    <span class="font-bold uppercase text-primary">{{ prod.rating.count }}</span>
                    </app-paragraph>
                </div>

                </div>
            </div>
            <!-- espace du bouton -->
            <div class="md:mt-10">
                <app-btn class="btn btn-success btn-block">Ajouter au <i class="ri-shopping-cart-2-fill"></i></app-btn>
            </div>
            </div>
        </div>
        </app-box-content>
    </section>
}
